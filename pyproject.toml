# 大话骰（Perudo）—— LLM 多人桌游引擎
# P0 工程脚手架配置：uv + ruff + mypy(strict) + pytest + coverage
# 依赖分层依据 docs/plan/01-build-plan.md §2.1（技术栈）与 §2.3（依赖边界）

[project]
name = "perudo"
version = "0.1.0"
description = "大话骰：一种以 LLM 玩家为核心的实时多人桌游引擎"
requires-python = ">=3.12"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
dependencies = [
    # 适配器：统一走 OpenAI 兼容 HTTP（设计稿 03 §1.2 B-08），不引入各家 SDK
    "httpx>=0.27",
    # 宿主：FastAPI + uvicorn（含 WebSocket，设计稿 04 F-05）
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/perudo"]

# PEP 735 开发依赖组（uv 默认安装 dev 组）
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    # 计划 §4.2 属性测试（回放一致 / 信息隔离 / 合法性完备）
    "hypothesis>=6.100",
    # 计划 §4.1 变异清单 v1（P1 内核阶段启用）
    "mutmut>=3.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# 排除 docs/：其中的 Python 片段只是设计稿示例，不属于代码门禁范围。
# ruff 会格式化 Markdown 内的 Python 代码块，若纳入则 `ruff format .` 会改写中文设计稿，
# 且纯文档改动会让 G-lint 门禁变红。
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "PTH"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src/perudo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["perudo"]

[tool.coverage.report]
show_missing = true
# 刻意不设 fail_under：P0 阶段尚无 core/engine 实现，过早设阈值会把空骨架判红。
# 覆盖率门槛按计划 §4.3（G-cov：core/engine 行覆盖 ≥ 95%）留待 P1 内核落地后再收紧。
