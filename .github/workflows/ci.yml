# llm-perudo CI 门禁 —— 依据 docs/plan/01-build-plan.md §4.3 门禁总表与 §2.3 依赖边界
# P0 阶段落地：G-lint / G-type / G-test / G-cov / G-trace 五个作业 + 依赖边界检查（§2.3 import 白名单）
# P1 起新增 G-mut（变异清单 V-1~V-8 全红，scripts/check_mutations.py）
# P2 起新增 G-e2e（脚本机器人全桌冒烟，计划 §4.3"每次合并跑"）
# action 版本：checkout / setup-python / upload-artifact 统一取 node24 档位
# （Node 20 已于 2026-09-16 从 GitHub runner 移除，旧版 action 声明 node20 存在运行时不兼容隐患）

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: 代码风格 · ruff
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 安装依赖（锁文件固定版本）
        run: uv sync --frozen

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

  type:
    name: 类型检查 · mypy
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 安装依赖（锁文件固定版本）
        run: uv sync --frozen

      # 现阶段 mypy 只覆盖 src/perudo（core 必过）；其余告警清零后转必过（§4.3 G-type）
      - name: mypy
        run: uv run mypy src/perudo

  test:
    name: 单元测试 · pytest · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖（锁文件固定版本）
        run: uv sync --frozen

      - name: pytest
        run: uv run pytest

  cov:
    name: 覆盖率 · pytest-cov
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 安装依赖（锁文件固定版本）
        run: uv sync --frozen

      # P1 核心落地后按 §4.3 收紧至 core/engine 行覆盖 ≥95%
      # （本阶段尚无 core/engine 代码，不设 --cov-fail-under，避免空跑误红）
      - name: pytest + coverage
        run: uv run pytest --cov=perudo --cov-report=term-missing --cov-report=xml

      - name: 上传 coverage.xml
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml-py313
          path: coverage.xml
          if-no-files-found: warn

  e2e:
    name: 端到端 · bot 全桌冒烟
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 安装依赖（锁文件固定版本）
        run: uv sync --frozen

      # 计划 §4.3 G-e2e（P2 起生效）：脚本机器人全桌冒烟，每次合并跑
      - name: 端到端冒烟
        run: uv run pytest tests/e2e -q

  mut:
    name: 变异清单 · V-1~V-8 全红
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 安装依赖（锁文件固定版本）
        run: uv sync --frozen

      # 计划 §4.1 变异清单 v1：每条 = 故意改坏内核一处，对应测试必须变红
      - name: 变异清单检查
        run: uv run python scripts/check_mutations.py

  trace:
    name: 追溯矩阵 · 孤儿检查
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 安装依赖（锁文件固定版本）
        run: uv sync --frozen

      - name: 追溯孤儿检查
        run: uv run python scripts/check_traceability.py

  deps:
    name: 依赖边界 · 零三方依赖
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 安装依赖（锁文件固定版本）
        run: uv sync --frozen

      # §2.3 依赖边界门禁化：core/engine 禁三方依赖、禁 random 直调、禁时钟与网络直调
      # （依据 02 A-19 零三方依赖 / A-10 随机源注入 / A-14 并发在引擎外）
      # P0 尚无 core/engine 目录，检查器判定为「暂未生效」并通过；P1 内核落地后自动生效
      - name: 依赖边界检查
        run: uv run python scripts/check_imports.py
